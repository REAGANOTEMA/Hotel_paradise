<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071A33">
<title>You are offline | Hotel Paradise on the Nile</title>
<link rel="icon" type="image/png" sizes="64x64" href="./logo-64.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#e8eef6;
       background:radial-gradient(ellipse at 50% -10%,rgba(201,162,39,.16),transparent 55%),linear-gradient(170deg,#050d1c,#071A33 55%,#0f2850);
       min-height:100dvh;display:grid;place-items:center;padding:24px}
  .card{max-width:440px;width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
        border-radius:18px;padding:32px 26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .card img{width:76px;height:76px;border-radius:50%;background:#fff;padding:3px;border:2px solid #C9A227;object-fit:cover}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:22px;margin:18px 0 8px;color:#fff;font-weight:600}
  p{color:#c3cfdd;font-size:14px;line-height:1.65;margin:0 0 10px}
  .warn{background:rgba(201,162,39,.14);border:1px solid rgba(201,162,39,.4);border-radius:10px;padding:12px 14px;
        color:#f0d78d;font-size:13px;margin:16px 0 20px}
  .btns{display:grid;gap:10px}
  a.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:10px;text-decoration:none;
        font-weight:700;font-size:14px}
  a.primary{background:linear-gradient(180deg,#e0b53a,#C9A227);color:#071A33}
  a.ghost{border:1px solid rgba(255,255,255,.3);color:#fff}
  small{display:block;margin-top:18px;color:#8fa0b6;font-size:11.5px}
</style>
</head>
<body>
  <main class="card">
    <img src="./logo-256.png" alt="Hotel Paradise on the Nile logo">
    <h1>You are offline</h1>
    <p>The hotel's pages could not be reached just now. Check your connection and try again.</p>
    <div class="warn" role="alert">
      A booking, a food order or a payment is only real once the hotel has confirmed it. Nothing is saved while you are offline.
    </div>
    <div class="btns">
      <a class="btn primary" href="./index.html">Try again</a>
      <a class="btn ghost" href="tel:+256759504928">Call the front desk</a>
    </div>
    <small>Hotel Paradise on the Nile &middot; Jinja, Uganda</small>
  </main>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
